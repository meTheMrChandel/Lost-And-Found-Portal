[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -v

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring a live database

[coverage:run]
source = apps
omit =
    */migrations/*
    */tests/*
    */management/*

[coverage:report]
show_missing = True
