# ─────────────────────────────────────────────────────────────────────────────
# IIT Ropar Lost & Found Portal — Production Multi-Container Compose Configuration
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:
  # 1. PostgreSQL 16 Relational Database
  db:
    image: postgres:16-alpine
    container_name: lostandfound_prod_db
    restart: always
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD come from the same file Django reads,
    # so the database and the backend can't end up with different credentials
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # 2. Redis In-Memory Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: lostandfound_prod_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # 3. Django ASGI Backend (REST API & Channels WebSockets)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lostandfound_prod_backend
    restart: always
    env_file:
      - .env.production
    environment:
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(urllib.request.urlopen('http://localhost:8000/api/v1/health/').status != 200)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - app_network

  # 4. Celery Async Task Worker (Matching engine & notification dispatch)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lostandfound_prod_celery_worker
    restart: always
    command: celery -A config worker -l info --concurrency=4
    env_file:
      - .env.production
    environment:
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - media_volume:/app/media
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # 5. Celery Beat Periodic Scheduler (Post expiry cleaner & scheduled tasks)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lostandfound_prod_celery_beat
    restart: always
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env.production
    environment:
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # 6. Next.js Production Web Frontend (Standalone Node runner)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lostandfound_prod_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      - backend
    networks:
      - app_network

  # 7. Nginx Edge Reverse Proxy & Static File Accelerator
  nginx:
    image: nginx:1.25-alpine
    container_name: lostandfound_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS certificates and the webroot used by certbot renewals (DEPLOYMENT.md step 3)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  app_network:
    driver: bridge
